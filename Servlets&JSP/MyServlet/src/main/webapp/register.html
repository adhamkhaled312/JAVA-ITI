<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

    <p id="error" style="color:red; font-weight:bold; display:none;">
        Username already exists!
    </p>

    <div>
        <h2>Register</h2>

        <form action="RegisterServlet" method="POST">

            <label>First Name:</label>
            <input type="text" name="firstName"
                   placeholder="Enter your first name" required><br><br>

            <label>Last Name:</label>
            <input type="text" name="lastName"
                   placeholder="Enter your last name" required><br><br>

            <label>Username:</label>
            <input type="text" name="username"
                   placeholder="Choose a username" required><br><br>

            <label>Password:</label>
            <input type="password" name="password"
                   placeholder="Enter a password" required><br><br>

            <button type="submit">Register</button>

        </form>
    </div>

    <script>
        if (new URLSearchParams(location.search).has("error"))
            document.getElementById("error").style.display = "block";
    </script>

</body>
</html>
