<!DOCTYPE html>
<html>
<head>
    <title>LogIn</title>
</head>
<div>
    <h2>Login</h2>
    <form action="j_security_check" method="POST">
        <label>Username:</label>
        <input type="text" name="j_username" placeholder="Enter your name" required><br><br>

        <label>Password:</label>
        <input type="password" name="j_password" placeholder="Enter your password" required><br><br>

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
