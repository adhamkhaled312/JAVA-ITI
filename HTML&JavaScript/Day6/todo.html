<!DOCTYPE html>
<head>
    <title>Todo List</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <h1>Todo List</h1>
    
    <div class="input-section">
        <input type="text" id="text" placeholder="What do you need to do?"><br><br>
        <input type="color" id="color"><br><br>
        <button onclick="add()">Add Todo Item</button>
    </div>
    <br>
    <div class="main">
        <div class="todos" id="list"></div>
        <div class="trash" id="trash">🗑️</div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
