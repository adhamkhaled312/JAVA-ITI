<!DOCTYPE html>
<html>
<head>
    <title>Factorial Table</title>
        <style>
        table {
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px 12px;
            text-align: center;
        }
        button {
            margin-top: 20px;
            padding: 8px 12px;
            font-size: 16px;
        }
        </style>
</head>
<body>
    <h2>Factorials of 0 to 10</h2>
    <button onclick="findFactorial()">Find factorial for</button>

    <table id="factorialTable">
        <tr>
            <th>Number</th>
            <th>Factorial</th>
        </tr>
    </table>


    <script>
        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        let table = document.getElementById("factorialTable");
        for (let i = 0; i <= 10; i++) {
            let row = table.insertRow();
            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            cell1.textContent = i;
            cell2.textContent = factorial(i);
        }

        function findFactorial() {
            let input = prompt("Enter a non-negative integer:");
            
            if (input === null) return;
            
            let num = Number(input);

            if (isNaN(num) || num < 0 || !Number.isInteger(num)) {
                alert("Invalid input! Please enter a non-negative integer.");
                return;
            }

            let result = factorial(num);
            alert(num + "! = " + result);
        }
    </script>
</body>
</html>
