<!DOCTYPE html>
<html>
<head>

    <style>
        #dropArea {
            width: 300px;
            height: 300px;
            border: 3px solid rgb(0, 0, 0);
            margin: 20px auto;
            text-align: center;
            line-height: 300px;
        }

        img {
            width: 100px;
            height: 100px;
            cursor: grab;
        }
    </style>
</head>
<body>

<h2 align="center">Drag the image into the box</h2>

<div id="dropArea"
     ondrop="drop(event)"
     ondragover="allowDrop(event)">
</div>

<br>

<img id="dragImg"
     src="photo.jpeg"
     draggable="true"
     ondragstart="drag(event)">


</body>
<script>

function allowDrop(ev) {
        ev.preventDefault();
    }

    function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
    }

    function drop(ev) {
        ev.preventDefault();
        let data = ev.dataTransfer.getData("text");
        ev.target.appendChild(document.getElementById(data));
    }
</script>
</html>
